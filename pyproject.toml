[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "currency-converter-mobin"
version = "0.1.0"
description = "Tkinter GUI + CLI currency converter using free FX providers, with tests and CI"
readme = "README.md"
requires-python = ">=3.9"
authors = [
{ name = "Mobin Yousefi", email = "" }
]
license = { text = "MIT" }
keywords = ["tkinter", "currency", "forex", "converter"]
classifiers = [
"Programming Language :: Python :: 3",
"License :: OSI Approved :: MIT License",
"Operating System :: OS Independent",
]


[project.urls]
Homepage = "https://github.com/mobinyousefi-cs"


[tool.setuptools]
package-dir = {"" = "src"}


[tool.setuptools.packages.find]
where = ["src"]


[tool.ruff]
line-length = 100


[tool.black]
line-length = 100